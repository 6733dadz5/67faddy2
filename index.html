<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Aerodrome</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#eef6f4;--dim:#d2e4e1;--acc:#8fe3d2;--sun:#ffcf8a;font-family:Figtree,system-ui,sans-serif;color:var(--ink);color-scheme:dark;box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1418}
canvas#w{position:fixed;inset:0;width:100%;height:100%}
.glass{position:relative;text-shadow:0 1px 3px rgba(0,0,0,.55);background:linear-gradient(140deg,rgba(20,34,42,.30),rgba(20,34,42,.16) 55%,rgba(20,34,42,.26));backdrop-filter:blur(9px) saturate(1.8) brightness(.9);-webkit-backdrop-filter:blur(9px) saturate(1.8) brightness(.9);border-radius:26px;
box-shadow:inset 1.5px 1.5px 0 rgba(255,255,255,.5),inset -1px -1px 0 rgba(255,255,255,.14),inset 2px 0 0 rgba(255,120,120,.1),inset -2px 0 0 rgba(120,190,255,.12),inset 0 0 24px rgba(255,255,255,.07),0 14px 44px rgba(0,0,0,.38);overflow:hidden}
.glass::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(260px circle at var(--mx,25%) var(--my,0%),rgba(255,255,255,.13),transparent 62%)}
.glass>*{position:relative}
#menu{position:fixed;inset:0;display:grid;align-content:center;justify-content:start;padding:0 7vw;transition:opacity .9s}
#menu .card{grid-area:1/1;width:min(380px,86vw);padding:32px 30px 30px;animation:rise .9s cubic-bezier(.2,.9,.25,1.05) backwards;transition:transform .8s cubic-bezier(.3,.8,.2,1),filter .7s,opacity .6s}#pick,body.pk #main{opacity:0;pointer-events:none;transform:translateX(-40px) scale(.96);filter:blur(14px)}body.pk #pick{opacity:1;pointer-events:auto;transform:none;filter:none}
body.fly #menu{opacity:0;pointer-events:none}body.fly #menu .card{transform:translateX(-60px) scale(.92);filter:blur(14px)}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.95);filter:blur(16px)}}
h1{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1;margin:0 0 6px}
.sub{color:var(--dim);font-size:15px;margin:0 0 26px;line-height:1.45}
.lbl{font-size:13px;color:var(--dim);margin:0 0 9px}
.seg{display:flex;padding:4px;border-radius:999px;background:rgba(0,0,0,.25);box-shadow:inset 0 1px 3px rgba(0,0,0,.4);position:relative;margin-bottom:24px}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:999px;background:linear-gradient(160deg,rgba(255,255,255,.4),rgba(255,255,255,.14));box-shadow:inset 1px 1px 0 rgba(255,255,255,.6),0 4px 14px rgba(0,0,0,.3);transition:transform .55s cubic-bezier(.34,1.5,.5,1)}
.seg button{flex:1;position:relative;background:none;border:0;color:var(--ink);font:600 14px Figtree,system-ui;padding:10px 0;cursor:pointer}
.go{width:100%;border:0;border-radius:999px;padding:17px;font:700 17px Figtree,system-ui;color:#06201c;cursor:pointer;background:linear-gradient(160deg,#c8fff3,var(--acc) 55%,#5fc7b3);box-shadow:inset 1px 1px 0 rgba(255,255,255,.8),0 10px 30px rgba(95,199,179,.35);transition:transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .3s}
.go:hover{transform:translateY(-2px) scale(1.015)}.go:active{transform:scale(.95)}
.go.alt{background:linear-gradient(140deg,rgba(255,255,255,.17),rgba(255,255,255,.06));color:var(--ink);text-shadow:0 1px 3px rgba(0,0,0,.55);box-shadow:inset 1px 1px 0 rgba(255,255,255,.55),inset -1px -1px 0 rgba(255,255,255,.15),0 8px 24px rgba(0,0,0,.28);margin-top:12px}
#main .seg{margin-bottom:0}#main .lbl{margin-top:26px}
.pc{display:flex;align-items:center;gap:14px;width:100%;margin-top:10px;padding:14px 16px;border-radius:20px;border:0;color:var(--ink);font:600 16px Figtree,system-ui;text-align:left;cursor:pointer;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);transition:transform .4s cubic-bezier(.34,1.56,.64,1),background .4s,box-shadow .4s}.pc:hover{transform:translateX(4px)}.pc.on{background:linear-gradient(140deg,rgba(143,227,210,.34),rgba(143,227,210,.1));box-shadow:inset 1px 1px 0 rgba(255,255,255,.55),inset 0 0 0 1px rgba(143,227,210,.5)}
.sw{display:flex}.sw i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}.sw i+i{margin-left:-6px}
#ctl{position:absolute;right:22px;top:50%;padding:20px 24px;transform:translate(30px,-50%) scale(.94);opacity:0;filter:blur(10px);transition:.5s cubic-bezier(.3,.9,.3,1)}#ctl.s{opacity:1;transform:translate(0,-50%);filter:none}#ctl div{display:flex;justify-content:space-between;gap:28px;font-size:14px;line-height:1.9}#ctl b{font-weight:600}#ctl span{color:var(--dim)}
#pl{max-height:48vh;overflow:auto;padding-right:6px;scrollbar-width:none}.nm{width:100%;box-sizing:border-box;padding:15px 20px;margin-bottom:12px;border-radius:999px;border:0;background:rgba(0,0,0,.25);box-shadow:inset 0 1px 3px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.14);color:var(--ink);font:600 16px Figtree,system-ui}.nm:focus{outline:0;box-shadow:inset 0 0 0 1.5px var(--acc)}
#map{position:absolute;top:20px;right:22px;width:176px;padding:8px;border-radius:30px;transition:width .6s cubic-bezier(.3,.9,.3,1)}#map.big{width:340px}#map canvas{display:block;width:100%;aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 14px #000}#net{text-align:center;font-size:12px;color:var(--dim);padding:6px 0 2px}
.tag{position:absolute;left:0;top:0;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;display:none}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 70%,rgba(0,0,0,.12))}
.keys{margin-top:20px;font-size:13px;color:var(--dim);line-height:1.7}.keys b{color:var(--ink);font-weight:600}
#hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1s .5s}body.fly #hud{opacity:1}
.dock{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:18px;padding:12px 22px 12px 12px;border-radius:999px}
.dock canvas{width:104px;height:104px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.28),inset 0 0 12px #000}
.st{min-width:78px}.st small{display:block;font-size:12px;color:var(--dim)}.st b{font-size:25px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.eng{position:absolute;left:22px;bottom:22px;padding:16px 18px;display:flex;gap:16px;align-items:flex-end}
.bars{display:flex;gap:8px}.bar{width:16px;height:104px;border-radius:9px;background:rgba(0,0,0,.35);box-shadow:inset 0 1px 3px #000;display:flex;align-items:flex-end;overflow:hidden}
.bar i{display:block;width:100%;border-radius:9px;background:linear-gradient(0deg,#4fd6a7,#c8fff0);transition:height .12s}.bar.f i{background:linear-gradient(0deg,#e8a64a,#ffe0a8)}
.chips{display:flex;flex-direction:column;gap:7px;font-size:13px}.chip{padding:5px 13px;border-radius:999px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);transition:background .4s,color .4s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.chip.on{background:rgba(143,227,210,.3);transform:scale(1.04)}.chip.warn{background:rgba(255,120,90,.4)}
#phase{position:absolute;top:20px;left:50%;transform:translateX(-50%);padding:9px 20px;border-radius:999px;font-size:14px;font-weight:600}
#toast{position:absolute;top:74px;left:50%;padding:11px 22px;border-radius:999px;font-size:14px;transform:translate(-50%,-14px) scale(.9);opacity:0;transition:.5s cubic-bezier(.34,1.56,.64,1)}#toast.s{opacity:1;transform:translate(-50%,0)}
#pause{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,12,14,.35)}#pause.s{display:flex}
#pause .glass{padding:30px 34px;width:min(380px,86vw);animation:rise .5s both}#pause h2{margin:0 0 14px;font-size:26px}
@media(max-width:760px){.dock .st:nth-of-type(n+3){display:none}.eng{transform:scale(.8);transform-origin:left bottom}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.lq .glass{backdrop-filter:url(#lg) blur(5px) saturate(1.8) brightness(.9)}
.glass{text-shadow:0 1px 2px rgba(0,0,0,.7),0 0 10px rgba(0,0,0,.35)}
</style></head><body>

<canvas id="w"></canvas>
<div id="menu"><section class="glass card" id="main"><h1 style="margin-bottom:22px">Aerodrome</h1><input class="nm" id="nm" maxlength="14" placeholder="Pilot name" autocomplete="off"><button class="go" id="go">Play</button><button class="go alt" id="pbtn">Planes</button>
<p class="lbl">Time of day</p><div class="seg" id="seg"><i></i><button>Dawn</button><button>Day</button><button>Dusk</button></div></section>
<section class="glass card" id="pick"><h1 style="font-size:32px;margin-bottom:14px">Planes</h1><div id="pl"></div>
<button class="go alt" id="back" style="margin-top:20px">Done</button></section></div>
<div id="hud">
<div class="glass" id="phase">On the runway</div><div class="glass" id="toast"></div>
<div class="glass eng"><div class="bars"><div class="bar"><i id="bt"></i></div><div class="bar f"><i id="bf"></i></div></div><div class="chips"><div class="chip" id="cN">N1 20%</div><div class="chip" id="cG">Gear down</div><div class="chip" id="cF">Flaps 1</div><div class="chip" id="cB">Brakes off</div></div></div>
<div class="glass" id="map"><canvas id="mc" width="320" height="320"></canvas><div id="net">Offline</div></div><div id="tags"></div>
<div class="glass" id="ctl"><div><b>Thrust</b><span>Shift up, X down</span></div><div><b>Pitch</b><span>W S</span></div><div><b>Roll</b><span>A D</span></div><div><b>Rudder</b><span>Q E</span></div><div><b>Gear</b><span>G</span></div><div><b>Flaps</b><span>F</span></div><div><b>Brakes</b><span>Space</span></div><div><b>Back to menu</b><span>B</span></div><div><b>Camera</b><span>C</span></div><div><b>Back to runway</b><span>R</span></div><div><b>Pause</b><span>Esc</span></div><div><b>Map size</b><span>M</span></div><div><b>Hide this</b><span>Ctrl</span></div></div>
<div class="glass dock"><canvas id="pfd" width="208" height="208"></canvas><div class="st"><small>Speed, kt</small><b id="sI">0</b></div><div class="st"><small>Altitude, ft</small><b id="sA">0</b></div><div class="st"><small>Climb, fpm</small><b id="sV">0</b></div><div class="st"><small>Heading</small><b id="sH">090</b></div></div></div>
<div id="pause"><div class="glass"><h2>Paused</h2><button class="go" id="res">Resume</button></div></div>
